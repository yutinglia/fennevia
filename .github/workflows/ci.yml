name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend and package gates
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Typecheck TypeScript and Svelte
        run: npm run typecheck

      - name: Run unit and lifecycle tests
        run: npm test

      - name: Rebuild and validate dependency inventory
        run: npm run dependencies:audit

      - name: Rebuild deterministic installed artifacts
        run: npm run build

      - name: Require committed generated bytes and manifest hashes
        shell: pwsh
        run: |
          if (git status --short) {
            git status --short
            throw "The production build differs from committed artifacts."
          }

      - name: Scan the exact production inventory
        run: npm run artifacts

      - name: Exercise artifact policy in Windows PowerShell 5.1
        shell: powershell
        run: >-
          .\tests\production-artifacts.Tests.ps1
