[workspace]
members = ["crates/installer-core", "crates/platform-windows", "crates/installer-worker", "src-tauri"]
default-members = ["crates/installer-core", "crates/platform-windows", "crates/installer-worker"]
resolver = "3"
exclude = ["vendor/webview2-com"]

[patch.crates-io]
webview2-com = { path = "vendor/webview2-com" }

[workspace.package]
version = "0.19.0-beta.1"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
uuid = { version = "=1.29.1", features = ["v4", "serde"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
