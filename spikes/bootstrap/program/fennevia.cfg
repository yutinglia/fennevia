// Firefox intentionally skips the first line of an AutoConfig .cfg file.
(() => {
  "use strict";

  const LOG_PREFIX = "[Fennevia bootstrap]";
  const ENTRY_URI =
    "chrome://fennevia/content/Bootstrap.sys.mjs";
  const PROCESS_STATE_KEY = Symbol.for(
    "fennevia.autoconfig.process-state"
  );

  const appMetadata = () => ({
    firefoxVersion: String(Services.appinfo.version),
    buildId: String(Services.appinfo.appBuildID),
  });

  const safeErrorName = error => {
    const name = typeof error?.name === "string" ? error.name : "Error";
    return /^[A-Za-z][A-Za-z0-9_.-]{0,79}$/.test(name)
      ? name
      : "UnsafeErrorName";
  };

  const redactStackLine = line =>
    String(line)
      .replace(/\bhttps?:\/\/[^\s)]+/giu, "<REMOTE_URL>")
      .replace(/\bfile:\/{2,3}.*$/giu, "<LOCAL_FILE>")
      .replace(/\b[A-Za-z]:[\\/].*$/gu, "<LOCAL_PATH>")
      .replace(/\\\\[^\\\s]+\\.*$/gu, "<UNC_PATH>")
      .replace(/\b(?:data|blob):[^\s)]+/giu, "<OPAQUE_URL>");

  const safeStack = error => {
    const rawStack = typeof error?.stack === "string" ? error.stack : "";
    if (!rawStack) {
      return ["<NO_STACK_AVAILABLE>"];
    }

    return rawStack.split(/\r\n|\n|\r/u).map(redactStackLine);
  };

  const safeErrorMessage = error => {
    const rawMessage =
      typeof error?.message === "string" ? error.message : "<NO_MESSAGE>";
    return redactStackLine(rawMessage)
      .replace(/[\u0000-\u001f\u007f]/gu, "")
      .slice(0, 500);
  };

  const emit = record => {
    const line = `${LOG_PREFIX} ${JSON.stringify(record)}`;
    Services.console.logStringMessage(line);
  };

  let phase = "preflight";
  let processState = globalThis[PROCESS_STATE_KEY];

  try {
    if (processState) {
      emit({
        schemaVersion: 1,
        event: "bootstrap.duplicate",
        phase,
        result: "skipped",
        code: "FENNEVIA_BOOTSTRAP_ALREADY_ATTEMPTED",
        context: "process",
        priorResult: processState.result,
        ...appMetadata(),
      });
      return;
    }

    processState = {
      result: "starting",
    };
    Object.defineProperty(globalThis, PROCESS_STATE_KEY, {
      value: processState,
      configurable: false,
      enumerable: false,
      writable: false,
    });

    if (
      Services.appinfo.inSafeMode ||
      Services.prefs.getBoolPref("fennevia.safeStart", false)
    ) {
      processState.result = "safe-start";
      emit({
        schemaVersion: 1,
        event: "bootstrap.skipped",
        phase,
        result: "safe-start",
        code: "FENNEVIA_BOOTSTRAP_SAFE_START",
        context: "process",
        ...appMetadata(),
      });
      return;
    }

    phase = "manifest-locate";
    const manifest = Services.dirsvc.get("UChrm", Ci.nsIFile);
    manifest.append("fennevia");
    manifest.append("chrome.manifest");
    if (!manifest.exists() || !manifest.isFile()) {
      throw new Error("FENNEVIA_BOOTSTRAP_MANIFEST_MISSING");
    }

    phase = "manifest-register";
    const registrar = Components.manager.QueryInterface(
      Ci.nsIComponentRegistrar
    );
    registrar.autoRegister(manifest);

    phase = "entry-resolve";
    const entryUri = Services.io.newURI(ENTRY_URI);
    const chromeRegistry = Cc[
      "@mozilla.org/chrome/chrome-registry;1"
    ].getService(Ci.nsIChromeRegistry);
    chromeRegistry.convertChromeURL(entryUri);

    phase = "entry-import";
    const entryModule = ChromeUtils.importESModule(ENTRY_URI);

    phase = "entry-contract";
    const result = entryModule.bootstrapResult;
    if (
      !result ||
      result.schemaVersion !== 1 ||
      result.status !== "ready" ||
      result.initializationCount !== 1
    ) {
      throw new Error("FENNEVIA_BOOTSTRAP_ENTRY_CONTRACT_INVALID");
    }

    processState.result = "ready";
    emit({
      schemaVersion: 1,
      event: "bootstrap.success",
      phase: "complete",
      result: "ready",
      code: "FENNEVIA_BOOTSTRAP_READY",
      context: "process",
      initializationCount: result.initializationCount,
      ...appMetadata(),
    });
  } catch (error) {
    if (processState) {
      processState.result = "failed";
    }
    emit({
      schemaVersion: 1,
      event: "bootstrap.fatal",
      phase,
      result: "failed",
      code: "FENNEVIA_BOOTSTRAP_FATAL",
      context: "process",
      errorName: safeErrorName(error),
      errorMessage: safeErrorMessage(error),
      stack: safeStack(error),
      ...appMetadata(),
    });
  }
})();
