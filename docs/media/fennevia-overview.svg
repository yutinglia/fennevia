<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <title>Fennevia four-edge Firefox interface map</title>
  <desc>A stylized Firefox window with tabs, bookmarks, downloads, and controls arranged around the four edges.</desc>
  <defs>
    <linearGradient id="bg" x1="86" y1="54" x2="1512" y2="846" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121820"/><stop offset="0.56" stop-color="#080C10"/><stop offset="1" stop-color="#11161A"/>
    </linearGradient>
    <linearGradient id="page" x1="462" y1="226" x2="1354" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F2EB"/><stop offset="1" stop-color="#DDE5E1"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8BC8FF"/><stop offset="1" stop-color="#C9FF72"/></linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" stroke="#F4F6F1" stroke-opacity="0.035"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.44"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
